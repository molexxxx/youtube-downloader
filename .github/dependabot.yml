# One transitive advisory has no upstream fix, so package.json carries an
# `overrides` entry for it. JSON takes no comments, so it is documented here.
# Re-check it on any dependency sweep and drop the override once the parent
# ships the fix itself.
#
# @discordjs/node-pre-gyp 0.4.5 (latest) still depends on tar ^6.1.11, and every
# tar 6 release is vulnerable to the node-tar path traversal set (GHSA-34x7-hfp2-rc4v
# and 11 others, critical). It only calls `tar.extract({cwd, strip, onentry})`,
# which tar 7 still supports, so the chain is overridden to ^7.5.22. Verified:
# @discordjs/opus still installs its prebuilt binary rather than falling back to
# a source build.
#
# vite is a direct devDependency rather than an override: electron-vite,
# @vitejs/plugin-react and vitest all take it as a peer, and npm ci
# --legacy-peer-deps does not install peers on its own.
#
# One development-only advisory is accepted without an override: minimatch
# GHSA-g3hv-75wg-m249, fixed only in minimatch 11. app-builder-lib (^10) and
# @electron/universal (^9) are the only consumers of the affected copies, and
# both leave optimizationLevel at its default of 1, while the amplification is
# only reachable at 2 or higher. Their patterns come from electron-builder.yml,
# and universal macOS builds are not produced. Re-check when either moves to
# minimatch 11.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Majors held back because they break `npm run lint` or `npm run build`.
    # Each was reproduced in isolation. Drop an entry once its upstream declares
    # support, and take that major in its own deliberate PR.
    #
    # typescript v7 is the ESM-only native rewrite. @typescript-eslint's CJS
    # require('typescript') gets a different shape back, so ts.Extension is
    # undefined and typescript-estree dies on `ts.Extension.Cjs`.
    #
    # eslint v10 crashes inside eslint-plugin-react, which still caps its peer
    # range at ^9.7.
    #
    # eslint-plugin-react-hooks v7 does not crash: it adds the
    # react-hooks/set-state-in-effect rule, which flags 7 genuine pre-existing
    # setState-in-useEffect sites. Unpinning means fixing those first.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types: ['version-update:semver-major']
    # Group only minor and patch updates. Majors arrive as their own PRs so one
    # breaking major cannot hold back the routine updates: a single group of 20
    # was blocked first by typescript 7, then by @vitejs/plugin-react 6, while
    # 17 harmless bumps waited behind them. Each major can now be judged, and
    # merged or closed, on its own.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  # The website keeps its own exactly pinned packages and lockfile, so it needs
  # its own entry. Routine bumps arrive as one PR and majors on their own, as
  # above. pages.yml redeploys the site when a merge lands on main.
  - package-ecosystem: npm
    directory: '/site'
    schedule:
      interval: weekly
    groups:
      site:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    # Same split as npm: routine action bumps arrive as one PR, majors as their
    # own so a breaking runner change is judged on its own.
    groups:
      github-actions:
        update-types:
          - minor
          - patch
